<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Library Portal — Login</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Library Portal</h1>
    <p>Sign in to create a session</p>

    <form action="/login" method="post" id="loginForm">
      <input name="name" type="text" placeholder="Your name" required minlength="2" />
      <button type="submit">Sign in</button>
    </form>

    <p id="msg" class="muted"></p>
  </div>

  <script>
    // show message via ?msg= in URL (optional)
    const p = new URLSearchParams(location.search).get('msg');
    if (p) document.getElementById('msg').textContent = decodeURIComponent(p);
  </script>
</body>
</html>
